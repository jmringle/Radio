name: Windows download check (dipstick, ft8-forecast)
# Installs a released Windows build the way a person does: download, extract with Explorer's zip
# handling, run. Browsers mark downloads as "from the internet" (a Zone.Identifier stream, the
# Mark of the Web), Explorer copies that mark onto every file it extracts, and .NET then refuses
# to load pythonnet's Python.Runtime.dll ("Failed to resolve Python.Runtime.Loader.Initialize").
# CI's own builds are never downloaded, so the build workflow can't see this. Run it from the
# Actions tab ("Run workflow") for a published release, or dipstick-release.yml runs it on the
# zip it just built, before making the draft: the unblocked run must pass or there's no draft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check"
        default: "dipstick-v0.1.0-beta.1"
  workflow_call:
    inputs:
      tag:
        description: "The release's tag (picks the app)"
        type: string
        required: true
      artifact:
        description: "Check this run's build artifact instead of a published release"
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}  # through env, never pasted into the script
      ARTIFACT: ${{ inputs.artifact }}
    steps:
      - name: The build artifact to check (before a release)
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: download
      - name: Download the Windows zip and check its checksum
        shell: bash
        run: |
          [[ "$TAG" =~ ^(dipstick|ft8-forecast)-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          # Each app's download and program names, from its own app workflow.
          case "${BASH_REMATCH[1]}" in
            dipstick) zip=dipstick-Windows.zip; exe='installed\Dipstick\Dipstick.exe'; proc=Dipstick ;;
            ft8-forecast) zip=FT8-Forecast-Windows.zip; exe='installed\FT8 Forecast\FT8 Forecast.exe'; proc='FT8 Forecast' ;;
          esac
          { echo "ZIP=$zip"; echo "EXE=$exe"; echo "PROC=$proc"; } >> "$GITHUB_ENV"
          mkdir -p download && cd download
          if [ -n "$ARTIFACT" ]; then
            sha256sum -c "$zip.sha256"  # the build's own checksum file, as the release will list it
          else
            gh release download "$TAG" -p "$zip" -p SHA256SUMS.txt
            sha256sum -c --ignore-missing SHA256SUMS.txt
          fi

      - name: Mark it as downloaded from the internet and extract it with Explorer's zip handling
        run: |
          $zip = (Resolve-Path "download\$env:ZIP").Path
          Set-Content -Path $zip -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"  # 3 = Internet, as a browser writes it
          New-Item -ItemType Directory installed | Out-Null
          $shell = New-Object -ComObject Shell.Application
          $shell.Namespace((Resolve-Path installed).Path).CopyHere($shell.Namespace($zip).Items(), 0x14)  # no dialogs
          $files = Get-ChildItem installed -Recurse -File
          $marked = @($files | Where-Object { Get-Item $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue })
          "extracted $($files.Count) files; $($marked.Count) carry the internet mark"
          if ($files.Count -eq 0) { throw "nothing extracted" }
          if ($marked.Count -eq 0) {
            # Report it plainly rather than pretend: mark them by hand so the next step still tests the mark.
            "::warning::Explorer's extraction didn't copy the mark on this runner; marking the files by hand"
            $files | ForEach-Object { Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          }

      - name: Run it with the files still marked (expected to fail if the mark is the cause)
        id: marked
        continue-on-error: true
        # Its own limit: a stuck app (an error dialog) can keep the step from ending even after
        # the kill below (found on the first run, which hung until the job's limit).
        timeout-minutes: 3
        run: |
          $app = Start-Process -FilePath $env:EXE -ArgumentList "--self-test" -PassThru
          $handle = $app.Handle  # without this, ExitCode stays empty
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "still running after 60 s: an error dialog, as on a real PC" }
          if ($app.ExitCode -ne 0) { throw "self-test failed: exit $($app.ExitCode)" }
          "the marked build started fine"

      - name: Close anything the marked run left open
        if: always()
        run: |
          Get-Process $env:PROC, msedgewebview2, WerFault -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, MainWindowTitle -AutoSize | Out-String
          Get-Process $env:PROC, WerFault -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Unblock the files and run it again (must pass)
        if: always()
        timeout-minutes: 3
        run: |
          Get-ChildItem installed -Recurse | Unblock-File
          $app = Start-Process -FilePath $env:EXE -ArgumentList "--self-test" -PassThru
          $handle = $app.Handle
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "still running after 60 s, probably an error dialog" }
          if ($app.ExitCode -ne 0) { throw "self-test failed: exit $($app.ExitCode)" }
          "the unblocked build passed its self-test"

      - name: Result
        shell: bash  # runs only when the unblocked build passed
        run: |
          if [ "${{ steps.marked.outcome }}" = failure ]; then
            echo "Marked files fail and unblocked files pass: Unblock (as the install steps say) is still needed."
          else
            echo "::warning::The marked build started fine too: the internet mark no longer stops it, so the Unblock step may not be needed any more."
          fi
