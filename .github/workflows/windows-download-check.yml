name: Windows download check (dipstick, ft8-forecast)
# Installs a released Windows build the way a person does: download, install, run. Browsers mark
# downloads as "from the internet" (a Zone.Identifier stream, the Mark of the Web). Explorer copied
# that mark onto every file it extracted from a zip, and .NET then refused to load pythonnet's
# Python.Runtime.dll ("Failed to resolve Python.Runtime.Loader.Initialize"), so both apps now ship
# an installer (dipstick 2026-11-16, ft8-forecast 2026-11-18). Here the setup file is marked,
# installed silently, and must leave no marked file behind, start with no Unblock, and uninstall.
# CI's own builds are never downloaded, so the build workflow can't see this. Run it from the
# Actions tab ("Run workflow") for a published release; dipstick-release.yml and ft8-forecast-app.yml
# run it on the build they just made.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check"
        default: "dipstick-v0.1.0-beta.1"
  workflow_call:
    inputs:
      tag:
        description: "The release's tag (picks the app)"
        type: string
        required: true
      artifact:
        description: "Check this run's build artifact instead of a published release"
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}  # through env, never pasted into the script
      ARTIFACT: ${{ inputs.artifact }}
    steps:
      - name: The build artifact to check (before a release)
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: download
      - name: Download the Windows build and check its checksum
        shell: bash
        run: |
          [[ "$TAG" =~ ^(dipstick|ft8-forecast)-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo "::error::bad tag $TAG"; exit 1; }
          # Each app's download and program names, from its own app workflow.
          case "${BASH_REMATCH[1]}" in
            dipstick) setup=dipstick-Windows-Setup.exe; dir='installed\Dipstick'; exe=Dipstick.exe ;;
            ft8-forecast) setup=Skipcast-Windows-Setup.exe; dir='installed\Skipcast'; exe='Skipcast.exe' ;;
          esac
          { echo "SETUP=$setup"; echo "DIR=$dir"; echo "EXE=$dir\\$exe"; } >> "$GITHUB_ENV"
          mkdir -p download && cd download
          if [ -n "$ARTIFACT" ]; then
            sha256sum -c "$setup.sha256"  # the build's own checksum file, as the release will list it
          else
            gh release download "$TAG" -p "$setup" -p SHA256SUMS.txt
            sha256sum -c --ignore-missing SHA256SUMS.txt
          fi

      - name: Mark the installer as downloaded, install it silently, and check no installed file is marked
        timeout-minutes: 5
        run: |
          $setup = (Resolve-Path "download\$env:SETUP").Path
          Set-Content -Path $setup -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"  # 3 = Internet, as a browser writes it
          $dir = Join-Path (Get-Location) $env:DIR
          # Started directly (no shell), so Windows' "Open File - Security Warning" can't wait for a click
          # on the runner; a person sees SmartScreen instead, which the README covers.
          $start = New-Object System.Diagnostics.ProcessStartInfo $setup
          $start.Arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$dir`" /LOG=`"$PWD\setup.log`""
          $start.UseShellExecute = $false
          $setupRun = [System.Diagnostics.Process]::Start($start)
          if (-not $setupRun.WaitForExit(180000)) { $setupRun.Kill(); throw "setup still running after 3 min" }
          if ($setupRun.ExitCode -ne 0) { Get-Content setup.log -Tail 30; throw "setup failed: exit $($setupRun.ExitCode)" }
          $files = Get-ChildItem installed -Recurse -File
          $marked = @($files | Where-Object { Get-Item $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue })
          "installed $($files.Count) files; $($marked.Count) carry the internet mark"
          if (-not (Test-Path $env:EXE)) { throw "no $env:EXE after installing" }
          if ($marked.Count -ne 0) { $marked | Select-Object -First 5 FullName | Out-String; throw "installed files carry the internet mark: the window won't start" }

      - name: Run the installed app with no Unblock (must pass)
        timeout-minutes: 3
        run: |
          $app = Start-Process -FilePath $env:EXE -ArgumentList "--self-test" -PassThru
          $handle = $app.Handle  # without this, ExitCode stays empty
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "still running after 60 s, probably an error dialog" }
          if ($app.ExitCode -ne 0) { throw "self-test failed: exit $($app.ExitCode)" }
          "the installed build passed its self-test with no Unblock"

      - name: Uninstall it (must remove the app)
        timeout-minutes: 3
        run: |
          $uninstaller = Join-Path $env:DIR "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "no uninstaller at $uninstaller" }
          $run = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru
          $handle = $run.Handle
          if (-not $run.WaitForExit(120000)) { $run.Kill(); throw "uninstaller still running after 2 min" }
          # The uninstaller copies itself to a temporary folder and finishes from there, so wait for the app's files to go.
          for ($i = 0; $i -lt 30 -and (Test-Path $env:EXE); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $env:EXE) { throw "$env:EXE still there after uninstalling" }
          "uninstalled"
