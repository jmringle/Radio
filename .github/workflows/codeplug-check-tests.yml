name: codeplug-check tests
on:
  push:
    paths: ["codeplug-check/**", ".github/workflows/codeplug-check-tests.yml"]
  pull_request:
    paths: ["codeplug-check/**", ".github/workflows/codeplug-check-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows and the newest, so both ends are tested.
        python: ["3.12", "3.15"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeplug-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: pytest
      # --skip-editable: our own package isn't on PyPI; a stranger's "codeplug-check" there mustn't be audited as ours.
      - run: pip-audit --skip-editable
