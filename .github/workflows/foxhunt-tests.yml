name: foxhunt tests
on:
  push:
    paths: ["foxhunt/**", ".github/workflows/foxhunt-tests.yml"]
  pull_request:
    paths: ["foxhunt/**", ".github/workflows/foxhunt-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows and the newest, so both ends are tested.
        python: ["3.12", "3.15"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foxhunt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # No requirements-rtl.txt: CI has no dongle, and the tests stand in for pyrtlsdr.
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps --only-shell chromium
      - run: pytest
      # --skip-editable: our own package isn't on PyPI; a stranger's "foxhunt" there mustn't be audited as ours.
      - run: pip-audit --skip-editable
