name: dipstick release
# Pushing a tag like dipstick-v0.1.0 (or dipstick-v0.1.0-beta.1) builds the app for all three
# systems and makes a DRAFT release with the downloads and SHA256SUMS.txt. Nothing is public until
# you look the draft over and press Publish on GitHub.
on:
  push:
    tags: ["dipstick-v*"]
permissions:
  contents: read
jobs:
  check-tag:
    # Before 20 minutes of builds: the tag must be a plain version that matches the code's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag's version matches pyproject.toml and the Mac app's
        env:
          TAG: ${{ github.ref_name }}  # through env, never pasted into the script (no injection)
        run: |
          [[ "$TAG" =~ ^dipstick-v([0-9]+\.[0-9]+\.[0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$ ]] \
            || { echo "::error::$TAG isn't like dipstick-v0.1.0 or dipstick-v0.1.0-beta.1"; exit 1; }
          version="${BASH_REMATCH[1]}"
          grep -qx "version = \"$version\"" dipstick/pyproject.toml \
            || { echo "::error::dipstick/pyproject.toml doesn't say version $version"; exit 1; }
          grep -q "\"CFBundleShortVersionString\": \"$version\"" dipstick/packaging/dipstick.spec \
            || { echo "::error::dipstick/packaging/dipstick.spec doesn't say version $version"; exit 1; }

  build:
    needs: check-tag
    uses: ./.github/workflows/dipstick-app.yml  # the same builds and self-tests as every push

  windows-download-check:
    # The Windows installer, used the way a person does (marked as downloaded, then installed): no
    # installed file may carry the mark, and the app must start with no Unblock, or no draft is made.
    needs: build
    uses: ./.github/workflows/windows-download-check.yml
    with:
      tag: ${{ github.ref_name }}
      artifact: dipstick-Windows

  release:
    needs: [build, windows-download-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # only this job, only to create the draft release
      # Build attestations (actions/attest README, v4.2.2, 2026-08-04): sign a certificate (id-token),
      # store the attestation (attestations) and its record (artifact-metadata).
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dipstick-*
          path: dist
          merge-multiple: true
      - name: Check every download against its checksum, then list them all in one file
        working-directory: dist
        run: |
          ls -l
          test "$(ls *.sha256 | wc -l)" -eq 3 || { echo "::error::expected 3 builds"; exit 1; }
          sha256sum -c *.sha256
          cat *.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      # A signed record that each file was built by this workflow from this tag, kept by GitHub,
      # so a swapped download fails `gh attestation verify <file> -R <this repo>` even if its
      # checksum was swapped too (QA 2026-11-16). Before the draft: no attestation, no release.
      - name: Attest where the builds came from
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/dipstick-macOS.dmg
            dist/dipstick-Windows-Setup.exe
            dist/dipstick-Linux.tar.gz
      - name: Create the draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#dipstick-v}"
          prerelease=""; [[ "$version" == *-* ]] && prerelease="--prerelease"
          # The install half of the notes; add "What's new" at the top by hand before publishing.
          # Quoted 'EOF' so the backticks stay literal; the repo name is filled in after.
          cat > ../release-notes.md <<'EOF'
          ## Download and install

          Dipstick is the NanoVNA explainer as an app for macOS, Windows and Linux. GitHub Actions built every file below from this tag, and each build opened its window and passed its self-test.

          - **Windows:** run `dipstick-Windows-Setup.exe`. It installs just for you (no administrator needed) and adds a Start menu entry and an uninstaller. No Unblock step is needed any more.
          - **macOS (Apple Silicon only):** open the dmg and drag **Dipstick** onto the Applications shortcut.
          - **Linux:** extract the archive and run `Dipstick/Dipstick` (needs WebKitGTK).

          More detail is in the README's Install section.

          ## The "unidentified developer" warning

          These builds aren't code-signed yet, so your computer warns you once.

          - **Windows:** SmartScreen says "Windows protected your PC". Click **More info → Run anyway**.
          - **macOS:** go to **System Settings → Privacy & Security** and click **Open Anyway**.

          ## Check your download

          - **Not altered:** compare it with `SHA256SUMS.txt`
            - macOS: `shasum -a 256 -c --ignore-missing SHA256SUMS.txt`
            - Linux: `sha256sum -c --ignore-missing SHA256SUMS.txt`
            - Windows: `Get-FileHash <file>`
          - **Built here by GitHub Actions from this tag:** `gh attestation verify <file> -R REPO_NAME`

          The app is the `dipstick-` files above. The Source code links are GitHub's automatic snapshot of the whole Radio repository; you don't need them to use Dipstick.
          EOF
          sed -i "s|REPO_NAME|$GH_REPO|" ../release-notes.md
          gh release create "$TAG" --verify-tag --draft $prerelease --title "dipstick $version" \
            --notes-file ../release-notes.md \
            dipstick-macOS.dmg dipstick-Windows-Setup.exe dipstick-Linux.tar.gz SHA256SUMS.txt
