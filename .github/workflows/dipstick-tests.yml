name: dipstick tests
on:
  push:
    paths: ["dipstick/**", ".github/workflows/dipstick-tests.yml"]
  pull_request:
    paths: ["dipstick/**", ".github/workflows/dipstick-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows and the newest, so both ends are tested.
        python: ["3.12", "3.15"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dipstick
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      # The page tests (tests/test_page.py) run in both engines the app uses; --with-deps adds the
      # Linux libraries WebKit needs.
      - run: playwright install --with-deps chromium webkit
      - run: pytest
      # --skip-editable: our own package isn't on PyPI; a stranger's "dipstick" there mustn't be audited as ours.
      - run: pip-audit --skip-editable
