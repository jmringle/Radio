name: dipstick app
on:
  push:
    paths:
      - "dipstick/src/**"
      - "dipstick/packaging/**"
      - "dipstick/requirements-*.txt"
      - ".github/workflows/dipstick-app.yml"
  workflow_dispatch:  # the Actions tab's "Run workflow" button
  workflow_call:  # dipstick-release.yml builds through this, so a release gets the same checks
permissions:
  contents: read
jobs:
  build:
    # PyInstaller only builds for the system it runs on, so each OS gets its own runner.
    strategy:
      fail-fast: false  # one OS failing still shows the others' results
      matrix:
        # ubuntu-24.04 named, not -latest: the GTK packages below are named for it.
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dipstick
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.12, the version the Mac build was first checked with; PyGObject 3.50.0 (Linux) predates 3.15.
          python-version: "3.12"
      - name: GTK and WebKit for the Linux window (and a virtual screen for the self-test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libcairo2-dev libgirepository1.0-dev gir1.2-webkit2-4.1 xvfb
      - run: pip install -r requirements-app.txt
      # Audit what this OS's build ships, before building it (QA 2026-11-16): dipstick-tests.yml audits
      # only the dev tools, and the app's Windows- and Linux-only packages install only here. A known
      # vulnerability fails the build, so a release (which builds through this file) can't ship it.
      # --skip-editable: our own package isn't on PyPI (see dipstick-tests.yml).
      - run: pip-audit --skip-editable
      - run: pyinstaller --noconfirm packaging/dipstick.spec

      # The self-test opens the built app's window, checks the page reached Python, and exits 0. It
      # gets no NanoVNA connection, so nothing is swept.
      - name: Self-test the built app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: dist/Dipstick.app/Contents/MacOS/Dipstick --self-test
      - name: Self-test the built app (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a dist/Dipstick/Dipstick --self-test
      - name: Self-test the built app (Windows)
        if: runner.os == 'Windows'
        # A windowed app reports its exit code only if waited on. The time limit is because a
        # crash can open an error dialog that nobody on a runner can dismiss.
        run: |
          $app = Start-Process -FilePath "dist\Dipstick\Dipstick.exe" -ArgumentList "--self-test" -PassThru
          $handle = $app.Handle  # without this, ExitCode stays empty
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "self-test still running after 60 s, probably an error dialog" }
          if ($app.ExitCode -ne 0) { throw "self-test failed: exit $($app.ExitCode)" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # The app beside a link to /Applications, so the README's "drag Dipstick to Applications"
          # works in the window that opens (QA 2026-11-16). ditto copies the bundle exactly.
          mkdir dist/dmg
          ditto dist/Dipstick.app dist/dmg/Dipstick.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Dipstick" -srcfolder dist/dmg -format UDZO dist/dipstick-macOS.dmg
          # Check what a person gets: mount the finished dmg and look (any failure stops the build).
          mount="$RUNNER_TEMP/dmg-check"
          mkdir "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/dipstick-macOS.dmg
          test -d "$mount/Dipstick.app"
          test "$(readlink "$mount/Applications")" = /Applications
          hdiutil detach "$mount"
          cd dist && shasum -a 256 dipstick-macOS.dmg > dipstick-macOS.dmg.sha256
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf dist/dipstick-Linux.tar.gz -C dist Dipstick
          cd dist && sha256sum dipstick-Linux.tar.gz > dipstick-Linux.tar.gz.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "dist\Dipstick" -DestinationPath dist\dipstick-Windows.zip
          # The standard "hash  name" line (lowercase, LF, no BOM), so `shasum -c` and `sha256sum -c` read it.
          $hash = (Get-FileHash dist\dipstick-Windows.zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\dist\dipstick-Windows.zip.sha256", "$hash  dipstick-Windows.zip`n")
      - name: Check the checksum file reads with the standard tools
        shell: bash  # Git Bash on Windows
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum -c dipstick-*.sha256; else shasum -a 256 -c dipstick-*.sha256; fi
      - uses: actions/upload-artifact@v7
        with:
          name: dipstick-${{ runner.os }}
          path: |
            dipstick/dist/dipstick-*
          if-no-files-found: error
          retention-days: 14
