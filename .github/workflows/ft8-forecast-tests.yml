name: ft8-forecast tests
on:
  push:
    # band-privileges too: ft8-forecast imports it, so a change there can break this.
    paths: ["ft8-forecast/**", "band-privileges/**", ".github/workflows/ft8-forecast-tests.yml"]
  pull_request:
    paths: ["ft8-forecast/**", "band-privileges/**", ".github/workflows/ft8-forecast-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    # Windows too (added 2026-10-30): the README has Windows setup steps, and paths, file
    # locking and time zones differ there.
    strategy:
      fail-fast: false  # one OS failing still shows the other's result
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ft8-forecast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -r requirements-dev.txt
      # The browser tests' Chromium (headless only) and, on Linux, the libraries it needs.
      - run: playwright install --with-deps --only-shell chromium
      - run: pytest
      # Audits the installed environment; -r can't resolve the local -e ../band-privileges line.
      - run: pip-audit
